<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default .Site.Language.Lang }}">
<head>
  {{ partial "head.html" . }}
  {{/* 告诉搜索引擎这篇文章还有哪些语言版本 */}}
  {{ range .AllTranslations }}
  <link rel="alternate" hreflang="{{ .Language.Locale | default .Lang }}" href="{{ .Permalink }}">
  {{ end }}
</head>
<body>
  {{ partial "header.html" . }}
  <main class="site-main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script src="{{ "js/main.js" | relURL }}?v={{ now.Unix }}"></script>
</body>
</html>
